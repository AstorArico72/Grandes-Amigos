<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<title>Restablecer contrasena | Grandes Amigos</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
	<style>
		body {
			background: radial-gradient(circle at 10% 20%, #f3f6ff 0, #eef2ff 25%, #f8f9fa 60%);
			min-height: 100vh;
		}
		.card {
			border: 1px solid #e7e9f3;
		}
	</style>
</head>
<body class="d-flex align-items-center">
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4 p-md-5">
						<div class="text-center mb-4">
							<h1 class="h4 mb-1">Restablecer contrasena</h1>
							<p class="text-secondary mb-0">Define una nueva contrasena para continuar.</p>
						</div>

						<div id="alert" class="alert d-none" role="alert"></div>

						<form id="resetForm" novalidate>
							<input type="hidden" id="token" />
							<div class="mb-3">
								<label for="password" class="form-label">Nueva contrasena</label>
								<input type="password" class="form-control" id="password" required minlength="8" autocomplete="new-password" />
								<div class="form-text">Minimo 8 caracteres.</div>
							</div>
							<div class="mb-4">
								<label for="confirmPassword" class="form-label">Confirmar contrasena</label>
								<input type="password" class="form-control" id="confirmPassword" required minlength="8" autocomplete="new-password" />
							</div>
							<div class="d-grid gap-2">
								<button id="btn-reset" type="submit" class="btn btn-primary">Cambiar contrasena</button>
								<a href="/Admin/Login" class="btn btn-outline-secondary">Volver al inicio de sesion</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		(function () {
			const form = document.getElementById('resetForm');
			const alertBox = document.getElementById('alert');
			const btn = document.getElementById('btn-reset');

			const params = new URLSearchParams(window.location.search);
			let token = params.get('TokenRecuperacion') || params.get('token');

			if (!token) {
				for (const [key, value] of params.entries()) {
					if (key.toLowerCase().includes('tokenrecuperacion')) {
						token = value;
						break;
					}
				}
			}

			function showAlert(message, type = 'danger') {
				alertBox.className = `alert alert-${type}`;
				alertBox.textContent = message;
				alertBox.classList.remove('d-none');
			}

			if (!token) {
				showAlert('Token no encontrado en la URL.', 'danger');
				form.classList.add('d-none');
				return;
			}
			document.getElementById('token').value = token;

			form.addEventListener('submit', async (e) => {
				e.preventDefault();
				alertBox.classList.add('d-none');

				if (!form.checkValidity()) {
					form.classList.add('was-validated');
					return;
				}

				const password = document.getElementById('password').value;
				const confirm = document.getElementById('confirmPassword').value;

				if (password !== confirm) {
					showAlert('Las contrasenas no coinciden.', 'danger');
					return;
				}

				const payload = {
					TokenRecuperacion: token,
					Password: password,
					ConfirmPassword: confirm,
				};

				btn.disabled = true;
				btn.textContent = 'Guardando...';

				try {
					const res = await fetch('/Api/Admin/CambiarClave', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(payload),
					});

					const responseText = await res.text();
					if (!res.ok) {
						throw new Error(responseText || 'No se pudo cambiar la contrasena.');
					}

					showAlert('Contrasena cambiada correctamente. Ya puedes iniciar sesion.', 'success');
					form.reset();
				} catch (err) {
					showAlert(err.message || 'Ocurrio un error al procesar la solicitud.', 'danger');
				} finally {
					btn.disabled = false;
					btn.textContent = 'Cambiar contrasena';
				}
			});
		})();
	</script>
</body>
</html>
